<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Dark Fantasy 3D Ultra 2K RPG</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; font-family: 'Courier New', monospace; background: #010002; color: #fff; user-select: none; touch-action: none; }
        #screen { width: 100vw; height: 100vh; position: relative; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(3,2,6,0.97); z-index: 20; text-align: center; }
        h1 { color: #8b0000; text-shadow: 0 0 25px #ff0000; font-size: 2.5em; margin: 0 10px 15px 10px; font-weight: bold; letter-spacing: 3px; }
        .room-controls { background: #07050d; padding: 25px; border: 2px solid #1a1326; border-radius: 8px; margin-bottom: 25px; display: flex; flex-direction: column; gap: 12px; width: 300px; box-shadow: 0 0 35px rgba(0,0,0,0.8); }
        .room-controls button { background: #700000; border: 1px solid #990000; padding: 14px; color: #fff; font-weight: bold; cursor: pointer; font-family: inherit; font-size: 1.1em; border-radius: 4px; transition: 0.2s; }
        .room-controls button:hover { background: #b00000; box-shadow: 0 0 20px rgba(255,0,0,0.6); }
        .hud { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(4,2,8,0.95); padding: 12px 25px; border: 1px solid #2d1f3d; border-radius: 6px; font-size: 0.9em; pointer-events: none; display: none; z-index: 10; text-align: center; min-width: 270px; }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="screen">
        <div id="char-selection" class="overlay">
            <h1>DARK FANTASY 2K ULTRA</h1>
            <div class="room-controls">
                <button onclick="startSinglePlayer()">ИГРАТЬ (ТЕСТ ГРАФИКИ 2K)</button>
            </div>
            <p style="color: #615773; font-size: 0.85em;">Ультимативная графика: 15 000 честных 3D-травинок, тени и объемный туман.</p>
        </div>

        <div id="game-hud" class="hud">
            <div style="font-weight: bold; color: #ffcc00;">ULTRA RPG (TEST)</div>
            <div>Комната: <span id="hud-zone" style="color:#00ffff;">1</span> | Врагов: <span id="hud-mobs" style="color:#ff3333;">0</span></div>
            <div style="font-size: 0.8em; margin-top: 5px; color: #ccc;">Здоровье: <span id="my-hp" style="color:#00ff00; font-weight:bold;">8/8</span></div>
        </div>
    </div>

    <script>
        let me = { color: 0x00ffff, hp: 8, mesh: null };
        let game = { currentZone: 1, mobsLeft: 0, active: false };
        let keys = { w: false, a: false, s: false, d: false };scene.add(new THREE.AmbientLight(0x0a0615, 0.9));
            let sunLight = new THREE.DirectionalLight(0x402560, 3.0);
            sunLight.position.set(30, 50, 20);
            sunLight.castShadow = true;
            scene.add(sunLight);

            let floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({ color: 0x08060d, roughness: 0.7 }));
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            generateUltimateGrass();

            me.mesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.7, 0), new THREE.MeshStandardMaterial({ color: me.color, roughness: 0.1, metalness: 0.9, emissive: me.color, emissiveIntensity: 0.5 }));
            me.mesh.position.set(0, 1.2, 20);
            me.mesh.castShadow = true;
            scene.add(me.mesh);

            let pLight = new THREE.PointLight(me.color, 3.5, 14);
            pLight.position.set(0, 1, 0);
            me.mesh.add(pLight);

            window.addEventListener('keydown', (e) => { let k = e.key.toLowerCase(); if(k==='w'||k==='ц') keys.w=true; if(k==='s'||k==='ы') keys.s=true; if(k==='a'||k==='ф') keys.a=true; if(k==='d'||k==='в') keys.d=true; });
            window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
            window.addEventListener('keyup', (e) => { let k = e.key.toLowerCase(); if(k==='w'||k==='ц') keys.w=false; if(k==='s'||k==='ы') keys.s=false; if(k==='a'||k==='ф') keys.a=false; if(k==='d'||k==='в') keys.d=false; });

            game.active = true;
            generateLocalZone();
            animate();
        }

        function generateUltimateGrass() {
            let grassCount = 15000;
            let bladeGeo = new THREE.ConeGeometry(0.07, 0.9, 3);
            bladeGeo.translate(0, 0.45, 0); 
            let grassMat = new THREE.MeshStandardMaterial({ color: 0x18102b, roughness: 0.6 });
            
            grassMat.onBeforeCompile = (shader) => {
                shader.uniforms.uTime = { value: 0 };
                shader.uniforms.uPlayerPos = { value: new THREE.Vector3() };
                shader.vertexShader = `
                    uniform float uTime;
                    uniform vec3 uPlayerPos;
                    ${shader.vertexShader}
                `.replace(
                    `#include <begin_vertex>`,
                    `
                    #include <begin_vertex>
                    float wave = sin(uTime * 3.0 + position.x * 1.5 + position.z * 1.5) * 0.25 * position.y;
                    transformed.x += wave;
                    transformed.z += wave * 0.4;
                    vec4 worldPos = instanceMatrix * vec4(position, 1.0);
                    float distP = distance(worldPos.xyz, uPlayerPos);
                    if(distP < 3.0) {game.mobsLeft = 5;
            document.getElementById('hud-mobs').innerText = game.mobsLeft;
            for(let i = 0; i < game.mobsLeft; i++) {
                let mesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshStandardMaterial({ color: 0x4a0e17 }));
                mesh.position.set((Math.random() - 0.5) * 40, 0.8, (Math.random() - 0.5) * 40);
                mesh.castShadow = true; scene.add(mesh);
                enemies.push({ mesh: mesh, speed: 4.0 });
            }
        }

        function animate() {
            if(!game.active) return; requestAnimationFrame(animate);
            let delta = clock.getDelta(), elapsed = clock.getElapsedTime();

            if(grassMesh && grassMesh.material.userData.shader) {
                grassMesh.material.userData.shader.uniforms.uTime.value = elapsed;
                grassMesh.material.userData.shader.uniforms.uPlayerPos.value.copy(me.mesh.position);
            }

            if(me.mesh) me.mesh.rotation.x += 0.3 * delta;

            let mx = 0, mz = 0;
            if(keys.w) mz -= 1; if(keys.s) mz += 1; if(keys.a) mx -= 1; if(keys.d) mx += 1;
            if(mx !== 0 || mz !== 0) {
                let moveVec = new THREE.Vector3(mx, 0, mz).normalize(); me.mesh.position.addScaledVector(moveVec, 9.5 * delta); me.mesh.rotation.y = Math.atan2(moveVec.x, moveVec.z);
            }

            enemies.forEach((e) => {
                let targetPos = me.mesh.position;
                if(e.mesh.position.distanceTo(targetPos) > 1.3) { e.mesh.position.addScaledVector(new THREE.Vector3().subVectors(targetPos, e.mesh.position).normalize(), e.speed * delta); e.mesh.lookAt(targetPos.x, e.mesh.position.y, targetPos.z); }
            });

            camera.position.set(me.mesh.position.x, me.mesh.position.y + 14, me.mesh.position.z + 16); camera.lookAt(me.mesh.position);
            renderer.render(scene, camera);
        }
                        float push = (3.0 - distP) * 0.4 * (position.y);
                        vec3 dir = normalize(worldPos.xyz - uPlayerPos);
                        transformed.x += dir.x * push;
                        transformed.z += dir.z * push;
                    }
                    `
                );
                grassMat.userData.shader = shader;
            };

            grassMesh = new THREE.InstancedMesh(bladeGeo, grassMat, grassCount);
            let dummy = new THREE.Object3D();
            for(let i = 0; i < grassCount; i++) {
                dummy.position.set((Math.random() - 0.5) * 90, 0, (Math.random() - 0.5) * 90);
                dummy.rotation.set(0, Math.random() * Math.PI, (Math.random() - 0.5) * 0.15);
                let scale = 0.5 + Math.random() * 0.9; dummy.scale.set(scale, scale, scale);
                dummy.updateMatrix(); grassMesh.setMatrixAt(i, dummy.matrix);
            }
            grassMesh.castShadow = true; scene.add(grassMesh);
        }

        function generateLocalZone() {
        let scene, camera, renderer, clock = new THREE.Clock(), grassMesh = null, enemies = [];

        function startSinglePlayer() {
            document.getElementById('char-selection').style.display = 'none';
            document.getElementById('game-hud').style.display = 'block';
            initGameWorld();
        }

        function initGameWorld() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x010003);
            scene.fog = new THREE.FogExp2(0x010003, 0.03); 

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
            document.getElementById('screen').appendChild(renderer.domElement);
